<!doctype html><html><body style="margin:0;background:transparent"><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// R190 hedge atlas: a tileable 2 m hedge panel rendered from the seven CC0
// Poly Haven searsia_lucida LOD0 shrubs. Top 1024x640 = front view (x 0..W,
// y 0..H), bottom 1024x384 = top view (x 0..W, z -D/2..D/2). Shrubs repeat at
// x±W so both tiles wrap horizontally. ?pass=normal writes view-space normals.
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search),pass=q.get('pass')||'color',W=2,H=1.3,D=.8,SIZE=1024,FRONT=640;
const rand=(i,s)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x);};
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,premultipliedAlpha:false});renderer.setPixelRatio(1);
renderer.setSize(SIZE,SIZE);renderer.setClearColor(0x000000,0);renderer.outputColorSpace=pass==='normal'?THREE.LinearSRGBColorSpace:THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x5d6650,2.2));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(.3,1,.6);scene.add(sun);
const g=await new GLTFLoader().loadAsync('/src/searsia_lucida/src/searsia_lucida.gltf');
const shrubs=[];g.scene.updateMatrixWorld(true);g.scene.traverse(o=>{if(/_LOD0$/.test(o.name)&&!shrubs.includes(o))shrubs.push(o);});
const normalMaterial=map=>new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{map:{value:map}},vertexShader:'varying vec2 vUv;varying vec3 vN;void main(){vUv=uv;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform sampler2D map;varying vec2 vUv;varying vec3 vN;void main(){if(texture2D(map,vUv).a<.5)discard;vec3 n=normalize(gl_FrontFacing?vN:-vN);gl_FragColor=vec4(n*.5+.5,1.);}'});
const templates=shrubs.map(s=>{const c=s.clone(true);c.traverse(o=>{if(o.isMesh){const m=[o.material].flat()[0];o.material=pass==='normal'?normalMaterial(m.map):new THREE.MeshLambertMaterial({map:m.map,side:THREE.DoubleSide,alphaTest:.5});}});c.position.set(0,0,0);c.rotation.set(0,0,0);c.scale.set(1,1,1);c.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(c);const k=new THREE.Group();c.position.set(-(b.min.x+b.max.x)/2,-b.min.y,-(b.min.z+b.max.z)/2);k.add(c);return {k,h:b.max.y-b.min.y};});
const N=28;for(let i=0;i<N;i++){const t=templates[i%templates.length],low=i%2===1,h=low?.5+rand(i,1)*.3:1+rand(i,1)*.28,s=h/t.h,x=(i+.2+rand(i,2)*.6)*W/N,z=low?.12+rand(i,3)*.15:(rand(i,3)-.5)*.4,a=rand(i,4)*Math.PI*2;
 for(const off of [-W,0,W]){const o=t.k.clone(true);o.scale.setScalar(s);o.scale.x*=low?1.3+rand(i,5)*.4:.9+rand(i,5)*.3;o.rotation.y=a;o.position.set(x+off,-.14*s*t.h,z);scene.add(o);}}
renderer.setScissorTest(true);
const front=new THREE.OrthographicCamera(0,W,H,0,-50,50);front.position.set(0,0,10);front.lookAt(0,0,0);front.position.set(0,0,10);
renderer.setViewport(0,SIZE-FRONT,SIZE,FRONT);renderer.setScissor(0,SIZE-FRONT,SIZE,FRONT);renderer.render(scene,front);
const top=new THREE.OrthographicCamera(0,W,D/2,-D/2,-50,50);top.position.set(0,20,0);top.up.set(0,0,-1);top.lookAt(0,0,0);
renderer.setViewport(0,0,SIZE,SIZE-FRONT);renderer.setScissor(0,0,SIZE,SIZE-FRONT);renderer.render(scene,top);
window.__out={W,H,D,front:[SIZE,FRONT],top:[SIZE,SIZE-FRONT],shrubs:shrubs.map(s=>s.name)};window.__png=renderer.domElement.toDataURL('image/png');
</script></body></html>
